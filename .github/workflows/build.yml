name: Build Ilam Scanner APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'IlamScanner-Android-Project.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Extract Android project
        run: unzip -q IlamScanner-Android-Project.zip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: 

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle -p IlamScanner assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ilam-Scanner-debug-APK
          path: IlamScanner/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
